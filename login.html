<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | PaisaGauge</title>
  <meta name="description" content="Log in to PaisaGauge to keep your calculator profile on this device.">
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-header"></div>
  <div class="auth-page">
    <div class="auth-art"><img src="assets/auth-hero.png" alt="Secure login"></div>
    <div class="auth-form">
      <form class="form-card" id="login-form">
        <h1>Welcome back</h1>
        <p class="muted">Log in to PaisaGauge. Accounts are stored only in this browser.</p>
        <div id="form-msg" class="alert hidden"></div>
        <label for="email">Email</label>
        <input class="input" id="email" name="email" type="email" required placeholder="you@email.com">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" required minlength="6">
        <button class="btn btn-primary btn-full" style="margin-top:18px" type="submit">Log in</button>
        <p class="note">New here? <a href="signup.html"><b>Create an account</b></a></p>
      </form>
    </div>
  </div>
  <div id="app-footer"></div>
  <script src="js/engine.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/render.js"></script>
  <script src="js/core.js"></script>
</body>
</html>
